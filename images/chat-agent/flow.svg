<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 960" width="1120" height="960" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Portfolio Chat Agent: information flow</title>
  <desc id="desc">At build time three sources (every site page in English and Chinese, about_en.md, and about_zh.md) are embedded by three encoders, which together write four static files: the e5 encoder embeds all three sources into the retrieval corpus (chunks_e5.json); the MiniLM encoder embeds the English page text and about_en into the English gate (gate_en_minilm.json), and separately re-embeds the retrieval corpus's own English chunks into an offline fallback corpus (chunks_en_minilm.json) for degraded mode; the bge-small-zh encoder embeds about_zh only, into the Chinese gate (gate_zh_bge.json). Only gate_en_minilm.json, chunks_en_minilm.json, and a small meta.json are served to the browser; chunks_e5.json and gate_zh_bge.json are bundled into the serverless function only. Per turn: the browser sends the name-normalized query to the serverless /embed endpoint, which runs the relevance gate (MiniLM for English, bge-small-zh for Chinese) and returns a pass/fail verdict; off-topic queries stop here, before any retrieval or LLM call. On a pass, the browser calls /chat with just the question; the function embeds it with e5, runs cosine similarity over its own bundled chunks_e5.json to get the top-k passages, injects them into the role prompt, and calls the LLM, returning the answer plus the source chunks that become the source cards. If the function is unavailable, a consent-gated in-browser MiniLM model handles retrieval locally over chunks_en_minilm.json, English only.</desc>
